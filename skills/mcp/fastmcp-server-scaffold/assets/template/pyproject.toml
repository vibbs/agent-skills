[project]
name = "scaffold-server"
version = "0.1.0"
description = "Scaffold Server: an MCP server that acts on an upstream API as the signed-in user."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Pinned to a minor version on purpose: FastMCP has shipped behaviour changes in
    # minor and patch releases. uv.lock pins the exact version; bump this range
    # deliberately and read the FastMCP changelog when you do.
    "fastmcp>=4.1,<4.2",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "inline-snapshot>=0.29",
    "ruff>=0.14",
    "pyright>=1.1.407",
    # scaffold:if with=coverage
    "pytest-cov>=7.0",
    # scaffold:end
]

[project.scripts]
scaffold-server = "scaffold_server.index:main"

[project.urls]
Homepage = "https://github.com/OWNER/scaffold-server"
Repository = "https://github.com/OWNER/scaffold-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold_server"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# scaffold:if with=coverage
addopts = "--cov=scaffold_server --cov-branch --cov-report=term-missing --cov-fail-under=80"
# scaffold:end

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
