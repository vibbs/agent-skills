[project]
name = "recipebox"
version = "0.2.0"
description = "Save and share recipes."
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "flask-login>=0.6,<0.7",
    "flask-wtf>=1.2,<2",
    "flask-sqlalchemy>=3.1,<4",
    "flask-migrate>=4.0,<5",
    "flask-babel>=4.0,<5",
    "psycopg[binary]>=3.2,<4",
    "python-json-logger>=2.0,<3",
    "gunicorn>=22,<23",
    "email-validator>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6,<0.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
