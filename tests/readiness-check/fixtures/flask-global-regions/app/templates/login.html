{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  {{ form.csrf_token }}
  {{ form.email.label }} {{ form.email() }}
  {{ form.password.label }} {{ form.password() }}
  <button type="submit">Log in</button>
</form>
<p>New here? <a href="{{ url_for('main.signup') }}">Create an account</a></p>
{% endblock %}
