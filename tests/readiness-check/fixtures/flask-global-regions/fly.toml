app = "recipebox"
primary_region = "gru"

[deploy]
  release_command = "flask --app app:create_app db upgrade"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
